<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0EEE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Minder</title>
<style>
:root{--ivory:#F0EEE6;--slate:#141413;--mut:#6b6a63;--line:#e2dfd3;--clay:#D97757;--red:#b8412f;--amb:#a8700f;--grn:#5f7a45;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ivory);color:var(--slate);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;font-size:15px;line-height:1.4;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#bar{flex:none;padding:calc(var(--top) + 14px) 16px 10px;display:flex;align-items:center;gap:8px}
#back{border:0;background:var(--clay);font-size:15px;font-weight:600;line-height:1;padding:9px 14px;border-radius:999px;color:#fff;cursor:pointer;display:none;flex:none}
.backrow{display:block;width:100%;text-align:left;border:0;background:none;color:var(--clay);font:inherit;font-weight:600;font-size:16px;padding:4px 0 12px;cursor:pointer}
#h1{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:27px;margin:0;flex:1;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
#sync i{width:8px;height:8px;border-radius:50%;background:#7aa35a;display:inline-block}
#sync.err i{background:#d1432f}#sync.loc i{background:#e0a030}
#editBtn{border:0;background:none;color:var(--clay);font-weight:600;font-size:15px;padding:6px 4px;cursor:pointer}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--bot) + 30px)}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;border:0;border-radius:22px;padding:20px 14px;min-height:138px;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;cursor:pointer;font:inherit;box-shadow:0 2px 0 rgba(20,20,19,.12);transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile.dark{color:var(--slate)}
.tile .ic{font-size:38px;line-height:1}
.tile .nm{font-size:18px;font-weight:600;line-height:1.15}
.tile .ct{font-size:12px;opacity:.85;font-weight:400;margin-top:2px;display:block}
.tile.add{background:transparent;color:var(--mut);border:2px dashed #c9c6b8;box-shadow:none}
.x{position:absolute;top:-9px;right:-9px;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--ivory);font-size:16px;line-height:1;display:none;align-items:center;justify-content:center;padding:0;cursor:pointer}
.edit .x{display:flex}
.x.ed{right:33px;background:var(--slate);font-size:15px}
.b.sm{padding:6px 14px;font-size:13px}
.sect{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line)}
#mItem input{border:1.5px solid #d6d2c2;border-radius:12px;padding:12px;font-size:16px;background:#fff}
#mItem input:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px rgba(217,119,87,.18)}
#mItem .btns{margin-top:20px}
#mItem .btns .pri{flex:1;padding:13px;font-size:16px;font-weight:600}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.qa .b{border:1.5px dashed var(--accent,var(--clay));color:var(--accent,var(--clay));background:transparent;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 28px);transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
.fcard .two{grid-template-columns:1fr;gap:0}
.card{position:relative;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,20,19,.08);border-left:7px solid var(--accent,var(--clay));cursor:pointer}
.card.svc{cursor:default;border-left-color:var(--grn)}
.card.over{border-left-color:var(--red)}.card.soon{border-left-color:#d49a2a}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-weight:650;font-size:16px}
.meta{color:var(--mut);font-size:13px}
.amt{font-weight:700}
.t-over{color:var(--red)}.t-soon{color:var(--amb)}
.chev{color:#b5b2a5;font-size:22px;align-self:center}
.hero{background:#fff;border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,20,19,.08);border-top:7px solid var(--accent,var(--clay))}
.hero h2{margin:0 0 4px;font-family:ui-serif,Georgia,serif;font-weight:500;font-size:24px}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:4px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.kv div{background:var(--ivory);border-radius:12px;padding:8px 12px}
.kv span{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kv b{font-size:15px;word-break:break-word}
.rem{background:#fff;border:1.5px solid #ecc9bd;border-radius:18px;padding:12px 14px 6px;margin-bottom:18px}
.remh{font-weight:700;color:var(--red);padding-bottom:6px}
.remrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.remrow>div{flex:1;min-width:0}
.remic{font-size:26px}
.nd{display:inline-block;margin-top:8px;background:#fff;color:var(--slate);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.3}
.nd.o{color:var(--red)}.nd.s{color:#8a5a00}
.card .row>div:last-child{text-align:right}
.due{display:inline-block;font-weight:800;font-size:15px;padding:4px 11px;border-radius:999px;background:#e3ecd6;color:#3f5a2a;text-align:center;white-space:nowrap}
.over .due{background:#f6d6cf;color:var(--red)}
.soon .due{background:#f8e5bd;color:#8a5a00}
.due+.meta{font-weight:700;font-size:14px;color:var(--slate);margin-top:5px}
.t-over,.t-soon{font-weight:800;font-size:14px}
.remrow .meta{font-weight:800;font-size:14px}
.remrow .meta.t-over,.remrow .meta.t-soon{font-size:15px}
button.b{font:inherit;border-radius:12px;border:1px solid var(--line);background:#fff;padding:9px 14px;cursor:pointer;color:var(--slate)}
button.b.pri{background:var(--clay);color:#fff;border-color:var(--clay)}
button.b.dng{color:var(--red)}
.addrow{width:100%;border:2px dashed #c9c6b8;background:transparent;border-radius:18px;padding:16px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;margin-bottom:12px}
.empty{color:var(--mut);text-align:center;margin:26px 10px}
.modal{position:fixed;inset:0;background:rgba(20,20,19,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--ivory);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(var(--bot) + 16px);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-family:ui-serif,Georgia,serif;font-weight:500;font-size:22px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--slate)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet.form{padding-bottom:0}
.fhead{display:flex;align-items:center;justify-content:space-between}
.fx{border:0;background:#e6e3d6;color:var(--slate);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;padding:0}
.fcard{background:#fff;border:1.5px solid #d6d2c2;border-radius:18px;padding:12px 14px 16px;margin-top:12px}
.fh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--clay);padding-bottom:8px;border-bottom:1px solid var(--line)}
.fcard label{margin:12px 0 5px;font-weight:600;color:#55544d}
.fcard input{border:1.5px solid #d6d2c2;background:#faf9f5;border-radius:12px;padding:12px;font-size:16px}
.fcard input:focus{outline:none;border-color:var(--clay);background:#fff;box-shadow:0 0 0 3px rgba(217,119,87,.18)}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.suf,.pre{position:relative}
.suf em,.pre em{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mut)}
.suf em{right:14px}.suf input{padding-right:76px}
.pre em{left:14px;font-weight:600;color:var(--slate)}.pre input{padding-left:30px}
.fbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:var(--ivory);padding:12px 0 calc(var(--bot) + 14px);margin-top:14px;border-top:1px solid var(--line)}
.fbar .pri{flex:1;padding:13px;font-size:16px;font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.quick button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.hist{border-top:1px solid var(--line);margin-top:10px;padding-top:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
</style>
</head>
<body>
<div id="bar">
  <button id="back">‹ Back</button><h1 id="h1">Minder</h1>
  <div id="sync" class="loc"><i></i><span id="syncT">This device</span></div>
  <button id="editBtn">Edit</button>
</div>
<div id="scroll"><div id="main"></div></div>

<div class="modal" id="mCat"><div class="sheet">
  <h3>New category</h3>
  <label>Name (e.g. Bikes, Water Tank, Generator)</label><input id="cName">
  <label>Icon (optional emoji)</label><input id="cIcon" maxlength="4" placeholder="🔧">
  <div class="btns"><button class="b pri" id="cSave">Add</button><button class="b" data-close>Cancel</button></div>
</div></div>

<div class="modal" id="mItem"><div class="sheet">
  <h3 id="iTitle">Add</h3>
  <label id="iNameL">Name</label><input id="iName">
  <div id="carF" style="display:none">
    <label>Registration number</label><input id="iReg" placeholder="KA 01 AB 1234" autocapitalize="characters">
    <label>Model / year</label><input id="iModel" placeholder="Hyundai i20, 2021">
  </div>
  <div id="genF"><label>Details (location, size, notes…)</label><input id="iDet"></div>
  <div id="firstF" style="display:none">
    <div class="sect">Due date (optional)</div>
    <input id="fsName" type="hidden">
    <label>Last done</label><input id="fsLast" type="date">
    <label>Next due</label><input id="fsNext" type="date">
    <label>Repeat every</label>
    <div class="suf"><input id="fsInt" type="number" min="1" value="6"><em>months</em></div>
    <div class="hint">Next due fills in by itself from Last done.</div>
  </div>
  <div class="btns"><button class="b pri" id="iSave">Save</button><button class="b" data-close>Cancel</button>
    <button class="b dng" id="iDel" style="margin-left:auto;display:none">Delete</button></div>
</div></div>

<div class="modal" id="mSvc"><div class="sheet form">
  <div class="fhead"><h3 id="sTitle">Add service</h3><button class="fx" data-close aria-label="Close">×</button></div>
  <div class="quick" id="sQuick"></div>
  <div class="fcard">
    <div class="fh"><span>🔧</span>What</div>
    <label>Service name</label>
    <input id="sName" placeholder="Service, insurance, gas refill…">
  </div>
  <div class="fcard">
    <div class="fh"><span>📅</span>Schedule</div>
    <div class="two">
      <div><label>Last done</label><input id="sLast" type="date"></div>
      <div><label>Next due</label><input id="sNext" type="date"></div>
    </div>
    <div class="hint">Leave Next due blank and it is worked out from Last done and the repeat period.</div>
    <label>Repeat every</label>
    <div class="suf"><input id="sInt" type="number" min="1" value="6"><em>months</em></div>
  </div>
  <div class="fcard">
    <div class="fh"><span>💰</span>Cost &amp; vendor</div>
    <label>Amount</label>
    <div class="pre"><em>₹</em><input id="sAmt" type="number" min="0" placeholder="0"></div>
    <label>Vendor phone</label>
    <input id="sPhone" type="tel" placeholder="Phone number">
    <label>Notes</label>
    <input id="sNotes" placeholder="Vendor, odometer, policy no.">
  </div>
  <div class="fbar">
    <button class="b pri" id="sSave">Save service</button>
    <button class="b" data-close>Cancel</button>
    <button class="b dng" id="sDel" style="display:none">Delete</button>
  </div>
</div></div>

<div class="modal" id="mDone"><div class="sheet">
  <h3 id="dTitle">Mark done</h3>
  <div class="two">
    <div><label>Date done</label><input id="dDate" type="date"></div>
    <div><label>Amount paid (₹)</label><input id="dAmt" type="number" min="0"></div>
  </div>
  <label>Note (optional)</label><input id="dNote" placeholder="e.g. 42,000 km">
  <div class="btns"><button class="b pri" id="dSave">Save &amp; schedule next</button><button class="b" data-close>Cancel</button></div>
</div></div>

<div class="modal" id="mHist"><div class="sheet">
  <h3 id="hTitle">History</h3><div id="hBody"></div>
  <div class="btns"><button class="b" data-close>Close</button></div>
</div></div>

<div class="modal" id="mConf"><div class="sheet">
  <h3 id="kTitle">Delete?</h3><div class="meta" id="kMsg"></div>
  <div class="btns"><button class="b dng" id="kYes">Delete</button><button class="b" data-close>Cancel</button></div>
</div></div>

<div id="toast"></div>
<script>
const KEY="minder_state_v1";
const PAL=[{c:"#D97757"},{c:"#6A9BCC"},{c:"#788C5D"},{c:"#C46686"},{c:"#141413"},{c:"#D4A27F",d:1},{c:"#9d9bc4"},{c:"#CC785C"},{c:"#4f8a8b"}];
const DEFAULT_CATS=[
 {id:"cars",name:"Cars",ic:"🚗",one:"car"},{id:"acs",name:"A/Cs",ic:"❄️",one:"A/C"},
 {id:"pest",name:"Pest Control",ic:"🐜",one:"treatment"},{id:"aqua",name:"Aquaguard",ic:"💧",one:"unit"},
 {id:"ins",name:"Insurance",ic:"🛡️",one:"policy"},{id:"geyser",name:"Geyser",ic:"🔥",one:"geyser"},
 {id:"clean",name:"Home Cleaning",ic:"🧹",one:"place"}].map((c,i)=>({...c,pi:i}));
const SUG={cars:[["Service",6],["Insurance",12],["PUC",6],["Tyres",24]],acs:[["Service",6],["Gas refill",12]],
  pest:[["Pest control",3]],aqua:[["Service",6],["Filter change",12]],ins:[["Renewal",12]],geyser:[["Service",12]],clean:[["Deep clean",6]]};
let state={v:0,cats:DEFAULT_CATS,items:[],services:[]};
let nav={cat:null,item:null}, editMode=false, editId=null, doneId=null, confirmFn=null, svcItemId=null;

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addMonths(s,n){const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
const daysUntil=s=>Math.round((parse(s)-parse(today()))/86400000);
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN");
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>parse(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const catOf=id=>state.cats.find(c=>c.id===id);
const itemOf=id=>state.items.find(i=>i.id===id);
const svcsOf=iid=>state.services.filter(s=>s.item===iid).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
const pal=c=>PAL[(c.pi||0)%PAL.length];
const itemSub=(i,c)=>c.id==="cars"?[i.reg,i.model].filter(Boolean).join(" · ")||i.details||"":(i.details||"");
const stt=s=>{const d=daysUntil(s.nextDue);return d<0?"over":d<=30?"soon":"ok"};
function dueText(s){const d=daysUntil(s.nextDue);
  if(d<0)return Math.abs(d)+" day"+(Math.abs(d)==1?"":"s")+" overdue";
  if(d==0)return"Due today";if(d==1)return"Due tomorrow";return"in "+d+" days"}

/* ---------- storage: this device (localStorage) ---------- */
function valid(d){return d&&Array.isArray(d.cats)&&Array.isArray(d.items)&&Array.isArray(d.services)}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(valid(d))state=d}catch(e){}}
function persist(){
  state.v=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));setSync("","Saved on this device")}
  catch(e){setSync("err","Could not save here")}
}
function setSync(kind,t){$("sync").className=kind;$("syncT").textContent=t}
function snapshot(){return {v:state.v,cats:state.cats,items:state.items,services:state.services}}

/* ---------- render ---------- */
function setBar(title,back){$("h1").textContent=title;$("back").style.display=back?"block":"none";
  $("editBtn").textContent=editMode?"Done":"Edit";$("scroll").classList.toggle("edit",editMode)}
function render(){
  if(nav.cat&&!catOf(nav.cat)){nav={cat:null,item:null}}
  if(nav.item&&!itemOf(nav.item))nav.item=null;
  if(nav.item)renderItem();else if(nav.cat)renderCat();else renderHome();
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3500)}
function backupHtml(){
  return `<div class="sect" style="margin-top:28px">Backup</div><p class="meta" style="margin:8px 0 0">Your data lives in this browser. Save a copy so you never lose it, or move it to another device.</p><div class="btns"><button class="b" id="bkSave">💾 Save a copy</button><button class="b" id="bkLoad">📂 Restore</button></div><input type="file" id="bkFile" accept=".json,application/json" hidden>`;
}
function saveBackup(){
  const n=new Date();
  const blob=new Blob([JSON.stringify({app:"minder",saved:n.toISOString(),...snapshot()},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="minder-backup-"+iso(n)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Backup saved");
}
function restoreBackup(file,input){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    input.value="";
    let d;try{d=JSON.parse(rd.result)}catch(e){toast("That file isn't a valid backup");return}
    if(!valid(d)){toast("That file isn't a valid backup");return}
    ask("Restore backup?",`This replaces what is in the app now with the backup (${d.items.length} items, ${d.services.length} services).`,()=>{
      state={v:0,cats:d.cats,items:d.items,services:d.services};nav={cat:null,item:null};persist();render();toast("Backup restored")},"Restore");
  };
  rd.readAsText(file);
}
function remindersHtml(){
  if(editMode)return"";
  const due=state.services.filter(s=>daysUntil(s.nextDue)<=14&&itemOf(s.item)).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  if(!due.length)return"";
  return `<div class="rem"><div class="remh">⏰ Needs attention (${due.length})</div>`+due.slice(0,6).map(s=>{
    const i=itemOf(s.item),c=catOf(i.cat),late=daysUntil(s.nextDue)<0;
    return `<div class="remrow" data-goitem="${i.id}" data-gocat="${c.id}"><span class="remic">${c.ic}</span><div><b>${esc(i.name)}</b> · ${esc(s.name)}<div class="meta ${late?"t-over":"t-soon"}">${dueText(s)} · ${fmt(s.nextDue)}</div></div>${s.amount?`<span class="amt">${money(s.amount)}</span>`:""}</div>`}).join("")+
    (due.length>6?`<div class="meta" style="padding:6px 2px">+${due.length-6} more</div>`:"")+`</div>`;
}
function renderHome(){
  setBar("Minder",false);
  $("main").innerHTML=remindersHtml()+`<p class="sub">${editMode?"Tap the red × to delete a category":"Pick a category"}</p><div class="grid">`+state.cats.map(c=>{
    const p=pal(c),n=state.items.filter(i=>i.cat===c.id).length;
    const nx=state.services.filter(s=>{const it=itemOf(s.item);return it&&it.cat===c.id}).sort((a,b)=>a.nextDue.localeCompare(b.nextDue))[0];
    const nd=nx?`<span class="nd ${daysUntil(nx.nextDue)<0?"o":daysUntil(nx.nextDue)<=30?"s":""}">${daysUntil(nx.nextDue)<0?"Overdue · ":"Due "}${parse(nx.nextDue).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span>`:"";
    return `<div class="tile ${p.d?"dark":""}" role="button" data-cat="${c.id}" style="background:${p.c}">
      <button class="x" data-delcat="${c.id}">×</button><span class="ic">${c.ic}</span>
      <span class="nm">${esc(c.name)}<span class="ct">${n} ${n==1?esc(c.one):esc(c.one)+"s"}</span>${nd}</span></div>`}).join("")+
    `<div class="tile add" role="button" id="newCat"><span class="ic">＋</span><span class="nm">Add category</span></div></div>`+(editMode?"":backupHtml());
}
function renderCat(){
  const c=catOf(nav.cat),p=pal(c);
  setBar(c.ic+" "+c.name,true);
  const items=state.items.filter(i=>i.cat===c.id);
  items.sort((a,b)=>{const x=svcsOf(a.id)[0],y=svcsOf(b.id)[0];return (x?x.nextDue:"9999").localeCompare(y?y.nextDue:"9999")});
  $("main").innerHTML=`<div style="--accent:${p.c}"><button class="backrow" data-back>‹ Back to all categories</button>`+items.map(i=>{
    const sv=svcsOf(i.id),nx=sv[0];
    return `<div class="card" data-item="${i.id}"><button class="x ed" data-edititem="${i.id}">✎</button><button class="x" data-delitem="${i.id}">×</button>
      <div class="row"><div><div class="title">${esc(i.name)}</div>
      <div class="meta">${esc(itemSub(i,c))}</div></div><span class="chev">›</span></div>
      <div class="meta" style="margin-top:6px">${nx?`<span class="${stt(nx)==="over"?"t-over":stt(nx)==="soon"?"t-soon":""}"><b>${esc(nx.name)}</b> · ${dueText(nx)}</span> · ${sv.length} service${sv.length==1?"":"s"}`:"No services yet"}</div><div class="btns" style="margin-top:8px"><button class="b sm ${(sv.length||c.id==="cars")?"":"pri"}" data-edititem="${i.id}">${(sv.length||c.id==="cars")?"✎ Edit":"✎ Edit / Due date"}</button></div></div>`}).join("")+
    `<button class="addrow" id="addItem">+ Add ${esc(c.one)}</button>`+
    `<button class="addrow" style="border-color:#e0b4aa;color:var(--red);margin-top:18px" data-delthis>Delete ${esc(c.name)} category</button>`+
    (items.length?"":`<div class="empty">No ${esc(c.one)}s yet. Add your first.</div>`)+`</div>`;
}
function qadd(c,sv){
  const have=sv.map(s=>s.name.trim().toLowerCase());
  const list=(SUG[c.id]||[]).filter(([n])=>!have.includes(n.toLowerCase()));
  return list.length?`<div class="qa">${list.map(([n,m])=>`<button class="b sm" data-qadd="${esc(n)}" data-m="${m}">+ ${esc(n)}</button>`).join("")}</div>`:"";
}
function renderItem(){
  const i=itemOf(nav.item),c=catOf(i.cat),p=pal(c);
  setBar(i.name,true);
  const sv=svcsOf(i.id);
  const total=sv.reduce((t,s)=>t+(s.history||[]).reduce((a,h)=>a+h.amount,0),0);
  $("main").innerHTML=`<div style="--accent:${p.c}"><button class="backrow" data-back>‹ Back to ${esc(c.name)}</button><div class="hero"><h2>${esc(i.name)}</h2>
    ${c.id==="cars"?`<div class="kv"><div><span>Registration</span><b>${esc(i.reg||"—")}</b></div><div><span>Model / year</span><b>${esc(i.model||i.details||"—")}</b></div></div>${(!i.reg&&!i.model)?`<button class="b pri" data-a="edititem" style="margin-top:10px">+ Add registration &amp; model</button>`:""}`:(i.details?`<div class="meta">${esc(i.details)}</div>`:"")}
    ${total?`<div class="meta" style="margin-top:4px">Total spent so far: <b>${money(total)}</b></div>`:""}
    ${editMode?`<div class="btns"><button class="b" data-a="edititem">${c.id==="cars"?"Edit car":"Edit details"}</button></div>`:""}</div>
    <div class="sec"><span>Services (${sv.length})</span></div>${qadd(c,sv)}`+
    sv.map(s=>{const h=s.history||[];
      return `<div class="card svc ${stt(s)}" data-id="${s.id}"><button class="x" data-delsvc="${s.id}">×</button>
        <div class="row"><div><div class="title">${esc(s.name)}</div>
        <div class="meta">${s.lastDone?"Last done "+fmt(s.lastDone):"Not done yet"} · every ${s.interval} mo</div></div>
        <div><div class="due">${dueText(s)}</div><div class="meta" style="text-align:right">${fmt(s.nextDue)}</div></div></div>
        <div class="row" style="margin-top:4px"><div class="meta">${esc(s.notes||"")}</div><div class="amt">${s.amount?money(s.amount):""}</div></div>
        <div class="btns"><button class="b pri" data-a="done">Mark done</button>
        ${s.phone?`<a href="tel:${esc(s.phone)}" style="text-decoration:none"><button class="b">📞 ${esc(s.phone)}</button></a>`:""}
        <button class="b" data-a="hist">History${h.length?" ("+h.length+")":""}</button>
        <button class="b" data-a="editsvc">Edit</button></div></div>`}).join("")+
    `<button class="addrow" id="addSvc">+ Add service</button></div>`;
}

/* ---------- dialogs ---------- */
const open=id=>$(id).classList.add("show"), shut=id=>$(id).classList.remove("show");
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("show"));
function ask(title,msg,fn,label){$("kYes").textContent=label||"Delete";$("kTitle").textContent=title;$("kMsg").textContent=msg;confirmFn=fn;open("mConf")}
$("kYes").onclick=()=>{shut("mConf");if(confirmFn)confirmFn();confirmFn=null};

/* categories */
$("cSave").onclick=()=>{
  const name=$("cName").value.trim();if(!name){$("cName").style.borderColor="#b8412f";return}
  state.cats.push({id:"c"+uid(),name,ic:$("cIcon").value.trim()||"🔧",one:"item",pi:state.cats.length});
  shut("mCat");persist();render();
};
function delCat(id){const c=catOf(id),n=state.items.filter(i=>i.cat===id).length;
  ask("Delete "+c.name+"?",n?`This also deletes ${n} ${n==1?"item":"items"} and all their services.`:"This category is empty.",()=>{
    const ids=new Set(state.items.filter(i=>i.cat===id).map(i=>i.id));
    state.services=state.services.filter(s=>!ids.has(s.item));state.items=state.items.filter(i=>i.cat!==id);
    state.cats=state.cats.filter(x=>x.id!==id);persist();render()})}
/* items */
function openItem(id){
  editId=id||null;const i=id?itemOf(id):null,c=catOf(i?i.cat:nav.cat);
  $("iTitle").textContent=i?"Edit "+c.one:"Add "+c.one;$("iNameL").textContent=c.name==="Cars"?"Car name (e.g. Swift, i20)":"Name";
  $("iName").value=i?i.name:"";$("iDet").value=i?i.details||"":"";$("iName").style.borderColor="";
  const car=c.id==="cars";$("carF").style.display=car?"block":"none";$("genF").style.display=car?"none":"block";
  $("iReg").value=i?i.reg||"":"";$("iModel").value=i?i.model||"":"";
  $("firstF").style.display=(car||(i&&svcsOf(i.id).length))?"none":"block";
  const sg=(SUG[c.id]||[["Service",6]])[0];
  $("fsName").value=sg[0];$("fsInt").value=sg[1];$("fsLast").value="";$("fsNext").value="";$("fsNext").dataset.manual="";
  if(car&&i&&!i.reg&&!i.model&&i.details)$("iModel").value=i.details;
  $("iDel").style.display=i?"block":"none";open("mItem");
}
$("iSave").onclick=()=>{
  const name=$("iName").value.trim();if(!name){$("iName").style.borderColor="#b8412f";return}
  const car=catOf(editId?itemOf(editId).cat:nav.cat).id==="cars";
  const f=car?{reg:$("iReg").value.trim().toUpperCase(),model:$("iModel").value.trim(),details:""}:{details:$("iDet").value.trim()};
  if(editId){Object.assign(itemOf(editId),{name},f);if(!svcsOf(editId).length)addFirst(editId)}
  else{const id=uid();state.items.push({id,cat:nav.cat,name,...f});nav.item=id;addFirst(id)}
  shut("mItem");persist();render();$("scroll").scrollTop=0;
};
function addFirst(itemId){
  const sn=$("fsName").value.trim(),sl=$("fsLast").value,sx=$("fsNext").value,si=Math.max(1,parseInt($("fsInt").value)||6);
  if(sn&&(sl||sx))state.services.push({id:uid(),item:itemId,history:[],name:sn,interval:si,lastDone:sl||"",nextDue:sx||addMonths(sl,si),amount:0,phone:"",notes:""});
}
$("iDel").onclick=()=>{shut("mItem");delItem(editId)};
function delItem(id){const i=itemOf(id);const n=svcsOf(id).length;
  ask("Delete "+i.name+"?",n?`This also deletes its ${n} service${n==1?"":"s"}.`:"",()=>{
    state.services=state.services.filter(s=>s.item!==id);state.items=state.items.filter(x=>x.id!==id);
    if(nav.item===id)nav.item=null;persist();render()})}
/* services */
function openSvc(id,itemId){svcItemId=itemId||nav.item;
  editId=id||null;const s=id?state.services.find(x=>x.id===id):null;const it=itemOf(svcItemId);
  $("sTitle").textContent=s?"Edit service":"Add service";
  $("sName").value=s?s.name:"";$("sInt").value=s?s.interval:6;$("sAmt").value=s?s.amount||"":"";
  $("sLast").value=s?s.lastDone||"":"";$("sNext").value=s?s.nextDue:"";
  $("sPhone").value=s?s.phone||"":"";$("sNotes").value=s?s.notes||"":"";$("sName").style.borderColor="";$("sNext").dataset.manual="";
  const sug=SUG[it.cat]||[["Service",6]];
  $("sQuick").innerHTML=s?"":sug.map(([n,m])=>`<button data-n="${esc(n)}" data-m="${m}">${esc(n)}</button>`).join("");
  $("sDel").style.display=s?"block":"none";open("mSvc");
}
function calcNext2(){
  if($("fsNext").dataset.manual)return;
  const l=$("fsLast").value,m=parseInt($("fsInt").value);
  if(l&&m>0)$("fsNext").value=addMonths(l,m);
}
["input","change"].forEach(ev=>{$("fsLast").addEventListener(ev,calcNext2);$("fsInt").addEventListener(ev,calcNext2);$("fsNext").addEventListener(ev,()=>{$("fsNext").dataset.manual=$("fsNext").value?"1":""})});
function calcNext(){
  if($("sNext").dataset.manual)return;
  const last=$("sLast").value,m=parseInt($("sInt").value);
  if(last&&m>0)$("sNext").value=addMonths(last,m);
}
$("sQuick").onclick=e=>{const b=e.target.closest("button");if(b){$("sName").value=b.dataset.n;$("sInt").value=b.dataset.m;calcNext()}};
["input","change"].forEach(ev=>{$("sLast").addEventListener(ev,calcNext);$("sInt").addEventListener(ev,calcNext);$("sNext").addEventListener(ev,()=>{$("sNext").dataset.manual=$("sNext").value?"1":""})});
$("sSave").onclick=()=>{
  const name=$("sName").value.trim();if(!name){$("sName").style.borderColor="#b8412f";return}
  const interval=Math.max(1,parseInt($("sInt").value)||6);
  const last=$("sLast").value;let next=$("sNext").value;
  if(!next)next=last?addMonths(last,interval):addMonths(today(),interval);
  const rec={name,interval,lastDone:last||"",nextDue:next,amount:+$("sAmt").value||0,phone:$("sPhone").value.trim(),notes:$("sNotes").value.trim()};
  if(editId)Object.assign(state.services.find(x=>x.id===editId),rec);
  else state.services.push({id:uid(),item:svcItemId,history:[],...rec});
  shut("mSvc");persist();render();
};
$("sDel").onclick=()=>{shut("mSvc");delSvc(editId)};
function delSvc(id){const s=state.services.find(x=>x.id===id);
  ask("Delete "+s.name+"?","Its history will be deleted too.",()=>{state.services=state.services.filter(x=>x.id!==id);persist();render()})}
$("dSave").onclick=()=>{
  const s=state.services.find(x=>x.id===doneId);if(!s)return;
  const date=$("dDate").value||today(),amt=+$("dAmt").value||0;
  s.history=s.history||[];s.history.unshift({date,amount:amt,note:$("dNote").value.trim()});
  s.lastDone=date;s.nextDue=addMonths(date,s.interval);if(amt)s.amount=amt;
  shut("mDone");persist();render();
};
function showHist(s){
  const h=s.history||[];$("hTitle").textContent=s.name;
  $("hBody").innerHTML=h.length?`<div class="meta">Total spent: <b>${money(h.reduce((t,x)=>t+x.amount,0))}</b></div><div class="hist">`+
    h.map((x,k)=>`<div><span>${fmt(x.date)}${x.note?" · "+esc(x.note):""}</span><span>${money(x.amount)} <button class="b dng" data-del="${k}" style="padding:1px 9px">×</button></span></div>`).join("")+`</div>`
    :`<div class="meta">No completed services logged yet.</div>`;
  $("hBody").dataset.sid=s.id;open("mHist");
}
$("hBody").onclick=e=>{const k=e.target.dataset.del;if(k==null)return;
  const s=state.services.find(x=>x.id===$("hBody").dataset.sid);if(!s)return;
  s.history.splice(+k,1);if(s.history.length)s.lastDone=s.history.map(x=>x.date).sort().pop();
  persist();render();showHist(s)};

/* ---------- navigation ---------- */
$("back").onclick=()=>{editMode=false;if(nav.item)nav.item=null;else nav.cat=null;render();$("scroll").scrollTop=0};
$("editBtn").onclick=()=>{editMode=!editMode;render()};
$("main").onclick=e=>{
  const t=e.target;
  let b;
  if(t.closest("[data-back]")){$("back").click();return}
  if(t.closest("#bkSave")){saveBackup();return}
  if(t.closest("#bkLoad")){$("bkFile").click();return}
  if(t.closest("[data-delthis]")){delCat(nav.cat);return}
  if(b=t.closest("[data-goitem]")){nav.cat=b.dataset.gocat;nav.item=b.dataset.goitem;editMode=false;render();$("scroll").scrollTop=0;return}
  if(b=t.closest("[data-delcat]")){delCat(b.dataset.delcat);return}
  if(b=t.closest("[data-qadd]")){openSvc(null,nav.item);$("sName").value=b.dataset.qadd;$("sInt").value=b.dataset.m;return}
  if(b=t.closest("[data-edititem]")){openItem(b.dataset.edititem);return}
  if(b=t.closest("[data-delitem]")){delItem(b.dataset.delitem);return}
  if(b=t.closest("[data-delsvc]")){delSvc(b.dataset.delsvc);return}
  if(t.closest("#newCat")){$("cName").value="";$("cIcon").value="";$("cName").style.borderColor="";open("mCat");return}
  if(b=t.closest("[data-cat]")){nav.cat=b.dataset.cat;editMode=false;render();$("scroll").scrollTop=0;return}
  if(t.closest("#addItem")){openItem();return}
  if(t.closest("#addSvc")){openSvc();return}
  if(b=t.closest("[data-item]")){nav.item=b.dataset.item;editMode=false;render();$("scroll").scrollTop=0;return}
  const btn=t.closest("button[data-a]");if(!btn)return;
  if(btn.dataset.a==="edititem"){openItem(nav.item);return}
  const card=t.closest(".card.svc");if(!card)return;
  const s=state.services.find(x=>x.id===card.dataset.id);if(!s)return;
  if(btn.dataset.a==="editsvc")openSvc(s.id);
  if(btn.dataset.a==="hist")showHist(s);
  if(btn.dataset.a==="done"){doneId=s.id;$("dTitle").textContent="Done: "+s.name;
    $("dDate").value=today();$("dAmt").value=s.amount||"";$("dNote").value="";open("mDone")}
};
$("main").addEventListener("change",e=>{if(e.target.id==="bkFile")restoreBackup(e.target.files&&e.target.files[0],e.target)});
load();render();
</script>
</body>
</html>
